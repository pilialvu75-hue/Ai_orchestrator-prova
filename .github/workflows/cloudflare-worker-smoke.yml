name: AIrLab Cloudflare Worker Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "wrangler.toml"
      - ".github/workflows/cloudflare-worker-smoke.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "wrangler.toml"
      - ".github/workflows/cloudflare-worker-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  worker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Start Python Worker and verify private API
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/airlab-pywrangler.log

          # Wrangler required-secret validation reads local development secrets
          # from .dev.vars. The file is ignored by git and CI is ephemeral.
          printf '%s\n' 'AIRLAB_AUTH_TOKEN="test-token"' > .dev.vars

          uvx --from workers-py pywrangler dev \
            --port 8787 \
            >"$LOG" 2>&1 &
          PID=$!
          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            rm -f .dev.vars
            echo "--- pywrangler log ---"
            cat "$LOG" || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 60); do
            if curl -fsS \
              -H 'Authorization: Bearer test-token' \
              http://127.0.0.1:8787/health \
              >/tmp/health.json 2>/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "pywrangler exited before the Worker became ready"
              exit 1
            fi
            sleep 2
          done
          test "$ready" = true

          python - <<'PY'
          import json
          with open('/tmp/health.json', encoding='utf-8') as handle:
              health = json.load(handle)
          assert health == {
              'status': 'ok',
              'service': 'airlab',
              'engine_id': 'mock-builder-v2',
          }, health
          PY

          code=$(curl -sS -o /tmp/unauthorized.json -w '%{http_code}' \
            http://127.0.0.1:8787/health)
          test "$code" = "401"
          python - <<'PY'
          import json
          with open('/tmp/unauthorized.json', encoding='utf-8') as handle:
              body = json.load(handle)
          assert body == {'error': 'unauthorized'}, body
          PY

          curl -fsS \
            -H 'Authorization: Bearer test-token' \
            -H 'Content-Type: application/json' \
            --data '{"task":"Cloudflare runtime smoke","project_id":"ci","target":"web","mode":"implement","task_family":"software","task_kind":"software.build","inputs":[],"requested_artifacts":[],"context":{}}' \
            http://127.0.0.1:8787/v1/tasks \
            >/tmp/task.json

          python - <<'PY'
          import json
          with open('/tmp/task.json', encoding='utf-8') as handle:
              result = json.load(handle)
          assert result['status'] == 'ok', result
          assert result['engine_id'] == 'mock-builder-v2', result
          assert result['operations'] == [{
              'action': 'create',
              'path': '.airlab/mock-result.txt',
              'content': 'AIrLab mock execution: Cloudflare runtime smoke\n',
          }], result
          PY

          # No real provider secret is configured in CI. The Worker must expose
          # an empty provider set and fail closed instead of returning the
          # deterministic control oracle as if it were real intelligence.
          curl -fsS \
            -H 'Authorization: Bearer test-token' \
            http://127.0.0.1:8787/v1/intelligence/providers \
            >/tmp/providers.json
          python - <<'PY'
          import json
          with open('/tmp/providers.json', encoding='utf-8') as handle:
              body = json.load(handle)
          assert body == {'providers': []}, body
          PY

          code=$(curl -sS -o /tmp/chat-unavailable.json -w '%{http_code}' \
            -H 'Authorization: Bearer test-token' \
            -H 'Content-Type: application/json' \
            --data '{"capability":"chat.general","messages":[{"role":"user","content":"hello"}]}' \
            http://127.0.0.1:8787/v1/chat/completions)
          test "$code" = "503"
          python - <<'PY'
          import json
          with open('/tmp/chat-unavailable.json', encoding='utf-8') as handle:
              body = json.load(handle)
          assert body == {'error': 'intelligence_unavailable'}, body
          PY
