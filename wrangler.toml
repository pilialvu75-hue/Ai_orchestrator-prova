name = "airlab-private-mock"
main = "src/cloudflare_worker.py"
compatibility_date = "2026-09-17"
compatibility_flags = ["python_workers"]
workers_dev = true

# Deployment must fail if the Worker-side bearer token is not configured.
[secrets]
required = ["AIRLAB_AUTH_TOKEN"]

# Keep invocation/error logs available while the private staging Worker is
# being stabilized. Application code must still avoid logging task/prompt text.
[observability]
enabled = true

# No secret values, provider keys, account IDs, or reusable browser credentials
# belong in this file. Configure AIRLAB_AUTH_TOKEN as an encrypted Worker Secret.
